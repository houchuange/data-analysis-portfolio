name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - '02-ecommerce-sql/docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 02-ecommerce-sql/docs

      # 产物刚 finalize 时 list artifacts 还查不到，等 API 追上再部署
      - name: Wait for artifact to register
        run: sleep 20

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
